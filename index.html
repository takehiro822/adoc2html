<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>AsciiDoc → HTML</title>
<style>
  :root{--ink:#1f2328;--sub:#5a6069;--rule:#e2e0d9;--bg:#fbfbf9;--accent:#33415c}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{display:flex;flex-direction:column;background:var(--bg);color:var(--ink);
       font:15px/1.6 -apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif}
  header{display:flex;gap:8px;align-items:baseline;padding:10px 14px;border-bottom:1px solid var(--rule)}
  header h1{margin:0;font-size:15px;font-weight:600}
  #status{font-size:12px;color:var(--sub)}
  nav{display:flex;border-bottom:1px solid var(--rule)}
  nav button{flex:1;padding:10px;border:0;background:none;font-size:13px;color:var(--sub);
             border-bottom:2px solid transparent}
  nav button[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent);font-weight:600}
  main{flex:1;min-height:0;position:relative}
  .pane{position:absolute;inset:0;display:none}
  .pane.on{display:block}
  textarea,pre{width:100%;height:100%;margin:0;border:0;padding:12px;overflow:auto;
    font:14px/1.55 ui-monospace,"SF Mono",Menlo,monospace;background:var(--bg);color:var(--ink)}
  textarea{resize:none}
  pre{white-space:pre-wrap;word-break:break-all}
  iframe{width:100%;height:100%;border:0;background:#fff}
  footer{display:flex;gap:8px;padding:10px 14px calc(10px + env(safe-area-inset-bottom));
         border-top:1px solid var(--rule)}
  footer button{flex:1;padding:11px 0;border:1px solid var(--rule);border-radius:8px;
                background:#fff;color:var(--ink);font-size:14px}
  footer button.main{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
  footer button:disabled{opacity:.4}
</style>
</head>
<body>
<header><h1>AsciiDoc → HTML</h1><span id="status">ライブラリを読み込み中…</span></header>
<nav>
  <button data-tab="edit" aria-selected="true">編集</button>
  <button data-tab="view" aria-selected="false">プレビュー</button>
  <button data-tab="html" aria-selected="false">HTML</button>
</nav>
<main>
  <div class="pane on" id="p-edit"><textarea id="src" placeholder="ここに .adoc を貼り付け"></textarea></div>
  <div class="pane" id="p-view"><iframe id="frame" sandbox="allow-same-origin"></iframe></div>
  <div class="pane" id="p-html"><pre id="out"></pre></div>
</main>
<footer>
  <input type="file" id="file" accept=".adoc,.asciidoc,.ad,.asc,.txt" hidden>
  <button id="open">開く</button>
  <button id="copy" disabled>コピー</button>
  <button id="save" class="main" disabled>HTMLを保存</button>
</footer>
<script>
const CDN = [
  'https://cdn.jsdelivr.net/npm/@asciidoctor/core/dist/browser/asciidoctor.js',
  'https://unpkg.com/@asciidoctor/core/dist/browser/asciidoctor.js',
  'https://cdn.jsdelivr.net/npm/@asciidoctor/core@3.0.4/dist/browser/asciidoctor.js',
  'https://cdn.jsdelivr.net/npm/@asciidoctor/core@2.2.6/dist/browser/asciidoctor.js'
];
const CSS_URL = 'https://cdn.jsdelivr.net/gh/asciidoctor/asciidoctor/data/stylesheets/asciidoctor-default.css';
const $ = id => document.getElementById(id);
let adoc = null, css = '', full = '';

const load = src => new Promise((ok, ng) => {
  const s = document.createElement('script');
  s.src = src; s.onload = ok; s.onerror = () => ng(new Error(src));
  document.head.appendChild(s);
});

(async () => {
  for (const url of CDN) {
    try { await load(url); if (typeof Asciidoctor === 'function') break; } catch (e) {}
  }
  if (typeof Asciidoctor !== 'function') {
    $('status').textContent = 'ライブラリを取得できません。通信を確認してください';
    return;
  }
  adoc = Asciidoctor();
  try { css = await (await fetch(CSS_URL)).text(); } catch (e) { css = ''; }
  $('status').textContent = 'Asciidoctor ' + adoc.getVersion() + ' 準備完了';
  $('copy').disabled = $('save').disabled = false;
})();

function convert() {
  if (!adoc) return '';
  let body;
  try {
    body = adoc.convert($('src').value, {
      safe: 'safe',
      attributes: { showtitle: true, toc: 'auto', sectanchors: true, icons: 'font', 'source-highlighter': null }
    });
  } catch (e) {
    body = '<pre>変換エラー: ' + String(e.message || e) + '</pre>';
  }
  full = '<!DOCTYPE html>\n<html lang="ja"><head><meta charset="utf-8">'
       + '<meta name="viewport" content="width=device-width,initial-scale=1">'
       + '<style>\n' + css + '\n</style></head><body class="article">'
       + '<div id="content">' + body + '</div></body></html>';
  $('out').textContent = full;
  $('frame').srcdoc = full;
  return full;
}

document.querySelectorAll('nav button').forEach(b => b.onclick = () => {
  document.querySelectorAll('nav button').forEach(x => x.setAttribute('aria-selected', x === b));
  document.querySelectorAll('.pane').forEach(p => p.classList.remove('on'));
  $('p-' + b.dataset.tab).classList.add('on');
  if (b.dataset.tab !== 'edit') convert();
});

$('open').onclick = () => $('file').click();
$('file').onchange = async e => {
  const f = e.target.files[0]; if (!f) return;
  $('src').value = await f.text();
  $('status').textContent = f.name;
};
$('copy').onclick = async () => {
  convert();
  try { await navigator.clipboard.writeText(full); $('status').textContent = 'コピーしました'; }
  catch (e) { $('status').textContent = 'コピー失敗。HTMLタブから手動で選択してください'; }
};
$('save').onclick = () => {
  convert();
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([full], { type: 'text/html' }));
  a.download = 'output.html';
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
};
</script>
</body>
</html>
